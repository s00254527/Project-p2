<mat-card class="card">
  <mat-card-header>
    <mat-card-title>{{ payment().amount | currency:'EUR' }}</mat-card-title>
    <mat-card-subtitle>{{ payment().type }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (payment().transaction) {
      <p>Method: {{ payment().transaction }}</p>
    }
    @if (payment().date) {
      <p>Date: {{ payment().date | date:'mediumDate' }}</p>
    }
  </mat-card-content>

  <mat-card-actions>
    <a matButton [routerLink]="['/payments', payment()._id]">View details</a>
  </mat-card-actions>
</mat-card>
