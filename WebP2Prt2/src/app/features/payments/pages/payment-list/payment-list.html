<div class="payment-list-container">
  <h2>Payment History</h2>

  @let s = state();
  <pre>{{ s | json }}</pre>
  @if (s.status === 'loading') {
    <p>Loading purchases...</p>
  } @else if (s.status === 'error') {
    <p> {{ s.message }}</p>
  } @else if (s.data.length === 0) {
    <p>No purchases available at the moment.</p>
  } @else {
    <div class="grid">
      @for (payment of s.data; track payment._id) {
        <app-payment-card [payment]="payment" />
      }
    </div>
}
</div>
