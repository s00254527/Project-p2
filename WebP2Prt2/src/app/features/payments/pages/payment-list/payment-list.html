<h2>Payment List</h2>

@if (payments$ | async; as payments) {
    <ul>
        @for (payment of payments; track payment._id) {
             <pre>{{ payments | json }}</pre>
            <li>{{ payment.type }} {{ payment.amount }}</li>
            <li>{{ payment.date }}</li>
        }
    </ul>
} @else {
    Loading Payments...
}
